name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-lock.txt -e .
      - run: npm ci --no-audit --no-fund
      - run: python -m math_testpaper doctor
      - run: python -m unittest discover -s tests -v
      - run: python -m math_testpaper build examples/demo/exam.json --out jobs/ci --font-profile nanum
      - run: python -m math_testpaper verify jobs/ci
      - uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            jobs/ci/exam.pdf
            jobs/ci/pages
            jobs/ci/validation.json
