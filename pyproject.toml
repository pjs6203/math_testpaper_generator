[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "math-testpaper-generator"
version = "0.1.0"
description = "AI-assisted Korean math exam typesetting in a KICE-style A3 two-column layout"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["reportlab>=4.4,<5", "pypdf>=6.0,<7", "pypdfium2>=5.0,<6", "Pillow>=11,<13"]

[project.scripts]
math-testpaper = "math_testpaper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
math_testpaper = ["*.cjs", "assets/*.json", "assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/fonts/*.md"]
